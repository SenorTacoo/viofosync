name: CI

# On main this workflow does NOT run on its own — "Publish image" calls it
# as its gate, so a push there would otherwise run the suite twice for the
# same commit. Everything else still gets CI directly.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Callable so "Publish image" can run these exact checks as its gate —
  # one definition of what green means, no copy that can drift.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
