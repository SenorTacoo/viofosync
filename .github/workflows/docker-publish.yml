# This fork builds its own image because it carries local patches
# (DELETE_RO_AFTER_DOWNLOAD) that the upstream robxyz/viofosync image
# does not have. Pushes to Docker Hub so Portainer can deploy a plain
# Web-editor stack — env vars stay editable in the Portainer UI, which
# a repository stack does not allow.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — your Docker Hub account name
#   DOCKERHUB_TOKEN    — a Docker Hub access token with Read & Write
#
# CI is the gate: the build job needs the `test` job, which calls ci.yml,
# so a failing suite means no image is pushed — including for a manual
# workflow_dispatch run.
name: Publish image

on:
  push:
    branches: [main]
    # Only docs are skipped. This workflow is now the sole thing running
    # CI on main, so ignoring more (tests/**, the workflow files) would
    # mean pushing those with no checks at all. Rebuilding for them costs
    # almost nothing: .dockerignore keeps tests, docs and .github out of
    # the build context, so the context is byte-identical and every layer
    # comes from the registry cache.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  # The gate: ruff + pytest, reusing ci.yml itself rather than a copy of
  # its steps. A red test suite fails this job, `needs` never resolves,
  # and nothing is pushed to Docker Hub — so :latest can only ever move
  # to a commit that passed CI.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # amd64 only: the arm64 leg would run under QEMU emulation and
          # the jellyfin-ffmpeg7 install makes that painfully slow. Add
          # linux/arm64 here if you ever deploy to an ARM host.
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/viofosync:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/viofosync:${{ github.sha }}
          # Layer cache in the registry, so a rebuild that only touched
          # web/ skips the ffmpeg apt layer entirely.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/viofosync:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/viofosync:buildcache,mode=max
